<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><title>Bracket · pronostica il tabellone</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14213d;--mute:#5b6678;--line:#d3d9e2;--acc:#c8e000;--accink:#14213d;--ok:#1f8a4c;--warn:#a26a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--card:#18223a;--ink:#eef1f6;--mute:#98a3b8;--line:#2b3753;--ok:#4cc882;--warn:#e8b04a}}
:root[data-theme="dark"]{--bg:#0f1624;--card:#18223a;--ink:#eef1f6;--mute:#98a3b8;--line:#2b3753;--ok:#4cc882;--warn:#e8b04a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.45}
a{color:inherit}main{max-width:1000px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:22px}
.logo{font-weight:800;font-size:1.5rem;letter-spacing:-.03em;text-decoration:none}.logo span{background:var(--acc);color:var(--accink);padding:0 7px;border-radius:6px}
nav{display:flex;gap:6px;flex-wrap:wrap}nav a{padding:6px 12px;border:1.5px solid var(--ink);border-radius:999px;text-decoration:none;font-size:.9rem}nav a.on{background:var(--acc);color:var(--accink);font-weight:600}
h1{font-size:clamp(2rem,6vw,3.6rem);line-height:1.02;font-weight:800;margin:0 0 10px;letter-spacing:-.035em}h2{font-size:1.15rem;margin:24px 0 8px}
p,li{color:var(--mute);max-width:70ch}.crumb{font-size:.85rem;color:var(--mute);margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;text-decoration:none}.card:hover{border-color:var(--ink)}
.card b{font-size:1.1rem;display:block;margin-bottom:4px}.card small{color:var(--mute)}.em{font-size:2rem}
.chip{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);margin-bottom:6px;font-weight:600}.chip.live{color:var(--ok);border-color:var(--ok)}.chip.prep{color:var(--warn);border-color:var(--warn)}
.btn{display:inline-block;background:var(--acc);color:var(--accink);font-weight:600;padding:9px 16px;border-radius:999px;text-decoration:none;margin:6px 0}
table{border-collapse:collapse;width:100%;max-width:700px;background:var(--card);border:1px solid var(--line);border-radius:8px}td,th{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);font-weight:400;font-size:.9rem}th{font-weight:600}
ol,ul{padding-left:20px}.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:10px}
.scroll{overflow-x:auto}

.g1{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:8px}
.r1{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;justify-content:space-between;font-size:.88rem}
.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.g3{display:flex;gap:10px}.col{flex:1;min-width:180px;display:flex;flex-direction:column;justify-content:space-around;gap:6px}
.col h2{font-size:.78rem;margin:0;font-weight:600;color:var(--mute);position:sticky;top:0;background:var(--bg);padding:3px 0}
.m{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:.82rem}.m.blk{outline:3px solid var(--ok)}
.t{display:flex;gap:6px;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-bottom:1px solid var(--line);font:inherit;color:inherit;cursor:pointer}
.t:disabled{cursor:default;color:var(--mute)}.t b{min-width:1.5em;color:var(--mute)}.t.sel{background:var(--acc);color:var(--accink)}.t.sel b{color:var(--accink)}
.t.win{box-shadow:inset 0 0 0 2px var(--ok)}.t.lose{box-shadow:inset 0 0 0 2px var(--ko,#c0392b);text-decoration:line-through}
.L{display:flex;align-items:center;gap:4px;padding:5px 8px}.r1 .L{padding:0}
.L button,.bar button{font:inherit;color:inherit;cursor:pointer}.L button{border:1px solid var(--line);background:none;border-radius:6px;min-width:28px;height:24px;padding:0 6px}
.L button.sel{background:var(--ink);color:var(--card);border-color:var(--ink)}.L button:disabled{opacity:.4;cursor:default}
.res{padding:5px 8px;font-size:.74rem;color:var(--mute);width:100%}.m .res{border-top:1px solid var(--line);background:var(--bg)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.bar button{border:1.5px solid var(--ink);background:transparent;padding:7px 13px;border-radius:999px}
.bar button[aria-pressed=true],.bar .go{background:var(--acc);color:var(--accink);font-weight:600}
.score{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}.big{font-size:2.2rem;font-weight:800}
tr.me td{font-weight:600}.timer{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:10px 14px;margin:10px 0;max-width:640px}.timer ul{margin:6px 0 0;padding-left:18px}.mini{margin-top:8px;font-size:.85rem;font-weight:600}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 18px}.tabs a{padding:6px 14px;border:1.5px solid var(--ink);border-radius:999px;text-decoration:none;font-size:.9rem}.tabs a.on{background:var(--acc);color:var(--accink);font-weight:600}.how h3{font-size:1rem;margin:18px 0 6px}.ex{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:12px 16px;margin:10px 0;max-width:720px}.how details.box{max-width:720px}.how summary{cursor:pointer;font-weight:600}.how details p{margin:8px 0 0}.fm label{display:block;margin:10px 0;font-size:.9rem}.fm input,.fm select,.fm textarea{display:block;font:inherit;padding:7px 10px;border:1.5px solid var(--ink);border-radius:8px;background:var(--card);color:var(--ink);width:100%;max-width:560px;margin-top:3px}.fm textarea{font-family:ui-monospace,monospace;max-width:720px}#auth{font-size:.85rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap}#auth input,.bar select{font:inherit;padding:6px 10px;border:1.5px solid var(--ink);border-radius:999px;background:var(--card);color:var(--ink)}#auth button{font:inherit;padding:6px 12px;border:1.5px solid var(--ink);border-radius:999px;background:transparent;color:inherit;cursor:pointer}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main>
<header><a class="logo" href="#/"><span>Bracket</span></a><nav id="nav"></nav><div id="auth"></div></header>
<div id="app"></div>
</main><footer style="text-align:center;padding:24px 16px;font-size:.85rem;opacity:.75"><a href="#/privacy">Privacy</a> · <a href="#/condizioni">Condizioni d'uso</a></footer>
<script src="config.js"></script>
<script>
// I dati di Supabase sono nel file config.js
const SB=window.SB_CONFIG||{url:"",key:""};
const SP={calcio:["Calcio","⚽"],tennis:["Tennis","🎾"],basket:["Basket","🏀"],pallavolo:["Pallavolo","🏐"]};
const U={ao:"https://claude.ai/artifact/M22DHCtxAJgwwJcFDTGrrz",nba:"https://claude.ai/artifact/MUsL6bD176fJxusBRxrLYM",ucl:"https://claude.ai/artifact/4DhPHGySxFi9EpXqZoM2S6"};
const UCL=[["Playoff",8,1],["Ottavi",8,2],["Quarti",4,4],["Semifinali",2,8],["Finale",1,16]];
const SECCA="Gara secca: 90' ×1,25 · supplementari ×3 · rigori ×2.";
const YN=(n,q,s,no,g)=>`Per ognuna delle ${n} squadre indichi se si qualifica al tabellone (${q} sì). Punti: sì ${s}, no ${no}${g?"; gruppo con tutte le risposte giuste ×1,5":""}.`;
const E=[
{id:"ucl",sp:"calcio",n:"Champions League 2025-26",play:1,cod:1,d:"Classifica a 36 squadre, playoff, ottavi-finale. Dati reali del torneo: vince il PSG, 11° in classifica.",
 ph:["Fase 1 · prima del torneo: assegni le 36 squadre a un blocco (prime 8, playoff, eliminate): 3, 1 e 2 punti per squadra giusta","Fase 2 · a classifica finale: i playoff reali","Fase 3 · a playoff chiusi: ottavi, quarti, semifinali e finale (tabellone fisso)"],R:UCL,und:1,
 dur:"Doppie sfide: 180' ×1,25 · supplementari ×3 · rigori ×4. Finale (gara secca): 90' ×1,25 · supplementari ×3 · rigori ×2."},
{id:"uel",sp:"calcio",n:"Europa League",cod:1,d:"Stessa struttura della Champions League, con i dati dell'ultima edizione.",ph:["Fase 1 · blocchi della classifica","Fase 2 · playoff","Fase 3 · tabellone finale"],R:UCL,und:1,dur:"Come la Champions League."},
{id:"wc",sp:"calcio",n:"Mondiali (48 squadre)",cod:2,d:"Passano 32 squadre su 48: prima si pronostica chi si qualifica, poi il tabellone reale.",
 ph:["Fase 1 · prima del torneo: "+YN(48,32,1,2,1),"Fase 2 · a gironi chiusi: tabellone reale a 32 squadre"],R:[["Sedicesimi",16,1],["Ottavi",8,2],["Quarti",4,4],["Semifinali",2,8],["Finale",1,16]],und:0,dur:SECCA},
{id:"euro",sp:"calcio",n:"Europei (24 squadre)",cod:2,d:"Passano 16 squadre su 24, poi tabellone dagli ottavi.",ph:["Fase 1 · prima del torneo: "+YN(24,16,1,2,1),"Fase 2 · a gironi chiusi: tabellone reale a 16 squadre"],R:[["Ottavi",8,1],["Quarti",4,2],["Semifinali",2,4],["Finale",1,8]],und:0,dur:SECCA},
{id:"copa",sp:"calcio",n:"Copa América (16 squadre)",cod:2,d:"Passano 8 squadre su 16, poi tabellone dai quarti.",ph:["Fase 1 · prima del torneo: "+YN(16,8,1,1,1),"Fase 2 · a gironi chiusi: tabellone reale a 8 squadre"],R:[["Quarti",4,1],["Semifinali",2,2],["Finale",1,4]],und:0,dur:SECCA},
{id:"prova",sp:"tennis",n:"Torneo di prova (8 giocatori)",play:1,live:1,test:1,cod:1,d:"Evento di collaudo, visibile solo agli admin.",ph:["Fase unica"],R:[["Quarti",4,1],["Semifinali",2,2],["Finale",1,4]],und:1,dur:"Partite al meglio dei 5: 3, 4 o 5 set ×2 · ritiro ×4."},{id:"ao",sp:"tennis",n:"Australian Open 2026 · singolare maschile",play:1,cod:1,d:"Tabellone da 128 giocatori con i risultati reali. Underdog: seed 1-32, poi non classificati.",
 ph:["Fase unica · prima del torneo: tabellone completo"],R:[["1° turno",64,1],["2° turno",32,2],["3° turno",16,4],["Ottavi",8,8],["Quarti",4,16],["Semifinali",2,32],["Finale",1,64]],und:1,
 dur:"Partite al meglio dei 5: 3, 4 o 5 set ×2 · ritiro o walkover ×4. Se è giusta una sola delle due squadre, la parte extra si dimezza."},
{id:"slam",sp:"tennis",n:"Altri Slam e singolare femminile",cod:1,d:"Roland Garros, Wimbledon, US Open e i tabelloni femminili: stessa struttura, cambia il numero di turni.",ph:["Fase unica · tabellone completo"],R:[["1° turno",64,1],["2° turno",32,2],["3° turno",16,4],["Ottavi",8,8],["Quarti",4,16],["Semifinali",2,32],["Finale",1,64]],und:1,dur:"Uomini: 3, 4 o 5 set ×2. Donne (al meglio dei 3): 2 o 3 set ×2. Ritiro ×4."},
{id:"nba",sp:"basket",n:"Playoff NBA 2026",play:1,cod:"s",d:"16 squadre, Ovest a sinistra ed Est a destra. Pronostico sul vincitore e sulla lunghezza della serie.",ph:["Fase unica · dopo il play-in: tabellone completo"],R:[["1° turno",8,1],["Semifinali di conference",4,2],["Finali di conference",2,4],["Finale NBA",1,8]],und:1,
 dur:"Lunghezza della serie (4-7 partite): punti della serie ×2, +50% se è giusta una sola squadra. In finale l'underdog è chi ha il peggior record di regular season."},
{id:"lba",sp:"basket",n:"Playoff Serie A di basket (LBA)",cod:"s",d:"Analogo all'NBA con un solo tabellone. Formato delle serie da confermare con i dati dell'ultima stagione.",ph:["Fase unica · tabellone dei playoff"],R:[["Quarti",4,1],["Semifinali",2,2],["Finale",1,4]],und:1,dur:"Lunghezza della serie ×2 (come NBA)."},
{id:"bkw",sp:"basket",n:"Mondiali ed Europei di basket",cod:2,d:"Fase 1 sì/no sulle squadre che arrivano al tabellone, fase 2 tabellone a eliminazione diretta.",ph:["Fase 1 · prima del torneo: qualificata al tabellone sì/no, punti inversi al tasso di base","Fase 2 · a gironi chiusi: tabellone reale"],R:[["Ottavi",8,1],["Quarti",4,2],["Semifinali",2,4],["Finale",1,8]],und:0,dur:"Gara secca: tempi regolamentari ×1,25 · supplementari ×3."},
{id:"sl",sp:"pallavolo",n:"Playoff SuperLega e Serie A1 femminile",cod:"s",d:"Analogo all'NBA: tabellone a serie. Formato da confermare con i dati dell'ultima stagione.",ph:["Fase unica · tabellone dei playoff"],R:[["Quarti",4,1],["Semifinali",2,2],["Finale",1,4]],und:1,dur:"Lunghezza della serie ×2."},
{id:"vbw",sp:"pallavolo",n:"Mondiali ed Europei di pallavolo",cod:2,d:"Fase 1 sì/no sulle squadre che arrivano al tabellone, fase 2 tabellone reale.",ph:["Fase 1 · prima del torneo: qualificata sì/no","Fase 2 · a gironi chiusi: tabellone reale"],R:[["Ottavi",8,1],["Quarti",4,2],["Semifinali",2,4],["Finale",1,8]],und:0,dur:"Partite al meglio dei 5: 3, 4 o 5 set ×2."}
];
const CODE={1:"Codice 1 · con seed o ranking",2:"Codice 2 · senza ranking",s:"Serie · come i playoff NBA"};
const pct=(i,n)=>n===1?1:.25+.75*i/(n-1),f=x=>+x.toFixed(2);
const NAVL=Object.entries(SP).map(([k,[n]])=>[k,n]).concat([["classifica","🏆 Classifiche"]]);
function nav(sp){document.getElementById("nav").innerHTML=NAVL.map(([k,n])=>`<a href="#/${k==="classifica"?"classifica/globale":"sport/"+k}" class="${sp===k?"on":""}">${n}</a>`).join("")}
function chip(e){if(e.pub===false)return'<span class="chip prep">Nascosto agli utenti</span>';return e.live?'<span class="chip live">Evento live</span>':e.play?'<span class="chip live">Edizione storica disponibile</span>':'<span class="chip prep">Struttura pronta · dati da caricare</span>'}
function home(){nav("");return`<h1>Pronostica il tabellone.<br>Vince chi lo azzecca meglio.</h1><p>Scegli lo sport, scegli l'evento, compila il tabellone: punti per ogni passaggio di turno, bonus per underdog, blocchi, turni perfetti e durata della sfida.</p>
<h2>Sport</h2><div class="grid">${Object.entries(SP).map(([k,[n,em]])=>{const ev=E.filter(e=>e.sp===k&&(!e.test||ADMIN));return`<a class="card" href="#/sport/${k}"><span class="em">${em}</span><b>${n}</b><small>${ev.length} eventi · ${ev.filter(e=>e.play).length} disponibili</small></a>`}).join("")}</div>
<h2>Come funziona</h2><div class="grid"><div class="box"><b>1 · Scegli</b><br>Ogni evento ha il suo regolamento e le sue fasi.</div><div class="box"><b>2 · Pronostica</b><br>Fasi in sequenza: i punti si sommano.</div><div class="box"><b>3 · Classifica</b><br>Più vincitori a pari merito, nessuno spareggio.</div></div>
${ADMIN?`<h2>Admin</h2><a class="card" href="#/admin" style="max-width:320px"><b>Importa un nuovo tabellone</b><small>Incolla i giocatori e crea l'evento</small></a>`:""}<h2>Area utente</h2><div class="box"><p style="margin:0">Registrazione con la tua email e link di accesso, più pronostici per utente fino a un massimo per evento. <i>In costruzione: richiede il collegamento a un servizio di accesso e a un database.</i></p></div>`}
function sport(k,sub){nav(k);const[n,em]=SP[k],ev=E.filter(e=>e.sp===k&&(!e.test||ADMIN)),w={calcio:"nel calcio",tennis:"nel tennis",basket:"nel basket",pallavolo:"nella pallavolo"}[k];return`<div class="crumb"><a href="#/">Home</a> / ${n}</div><h1>${em} ${n}</h1><div class="tabs"><a href="#/sport/${k}" class="${sub?"":"on"}">Eventi</a><a href="#/sport/${k}/come-funziona" class="${sub?"on":""}">Come funziona ${w}</a></div>${sub?comeSport(k):`<div class="grid">${ev.map(e=>`<a class="card" href="#/evento/${e.id}">${chip(e)}<b>${e.n}</b><small>${e.d}</small>${cardTimer(e.id)}</a>`).join("")}</div>`}`}
function evento(id){const e=E.find(x=>x.id===id);if(!e)return home();nav(e.sp);const n=e.R.length;
const rows=e.R.map(([nm,m,b],i)=>{const p=pct(i,n);return`<tr><td>${nm}</td><td>${m}</td><td>${b}</td><td>${e.und?"+"+f(p*100)+"%":"–"}</td><td>${i<n-1?"+"+f(b*m*p):"–"}</td></tr>`}).join("");
return`<div class="crumb"><a href="#/">Home</a> / <a href="#/sport/${e.sp}">${SP[e.sp][0]}</a> / ${e.n}</div>${chip(e)}<h1 style="font-size:clamp(1.8rem,5vw,2.8rem)">${e.n}</h1><p>${e.d}</p>${timerBox(e.id)}${ADMIN&&e.db?`<p><button class="btn" style="border:0;cursor:pointer;font:inherit" onclick="togglePub('${e.id}')">${e.pub===false?"Pubblica di nuovo":"Nascondi evento"}</button>${e.pub===false?" <small>Ora l'evento è nascosto agli utenti</small>":""}</p>`:""}
${e.play?`<a class="btn" href="#/gioca/${e.id}">${e.live?'Apri il tabellone e pronostica':'Prova l\'edizione storica'}</a>`:'<p><i>La struttura e le regole sono definite; mancano il tabellone e i risultati reali da caricare.</i></p>'}
<h2>Fasi</h2><ol>${e.ph.map(x=>`<li>${x}</li>`).join("")}</ol>
<h2>Punti · ${CODE[e.cod]}</h2><div class="scroll"><table><tr><th>Turno</th><th>Partite</th><th>Punti base</th><th>Underdog</th><th>Turno perfetto</th></tr>${rows}</table></div>
<h2>Durata</h2><p>${e.dur}</p>
<h2>Regole comuni</h2><ul><li>Punti base: raddoppiano a ogni turno, quindi ogni turno ha lo stesso massimo.</li><li>${e.und?"Underdog: se vince la squadra con il seed o ranking peggiore, bonus del turno (da +25% a +100% nella finale).":"Nessun bonus underdog."}</li><li>Blocco: due partite collegate indovinate valgono ×1,5.</li><li>Turno perfetto: bonus pari al massimo del turno per la percentuale del turno.</li><li>Più vincitori ammessi, nessuno spareggio. Fino a 3 pronostici per utente e per fase.</li></ul><p><a href="#/sport/${e.sp}/come-funziona">Come funziona questo sport: spiegazione ed esempi</a></p>`}

const BOZ='<div class="box" style="border-left:4px solid #c90"><b>BOZZA</b> · testo preparato come base di lavoro: da far rivedere a un legale prima della apertura al pubblico. I campi tra [parentesi quadre] vanno completati.</div>';
function privacy(){nav("");return`<div class="crumb"><a href="#/">Home</a> / Privacy</div><h1>Informativa sulla privacy</h1>${BOZ}
<h2>Titolare del trattamento</h2><p>[Nome e cognome o ragione sociale], [indirizzo], email di contatto: [email]. Il sito si chiama [nome del sito] ([indirizzo del sito]).</p>
<h2>Quali dati trattiamo</h2><ul><li><b>Email</b>: serve per creare l'account e inviarti il link di accesso.</li><li><b>Nome pubblico</b> scelto da te: compare nelle classifiche. Non usare il tuo nome reale se non vuoi mostrarlo.</li><li><b>Pronostici e punteggi</b>: i pronostici di una fase restano visibili solo a te finché la fase è aperta, poi diventano visibili agli altri utenti insieme ai punteggi.</li><li><b>Dati tecnici</b> (indirizzo IP, browser, orari di accesso) trattati dai fornitori del servizio per sicurezza e funzionamento.</li><li><b>Email di promemoria</b>, se attivate: ti avvisiamo prima della chiusura di una fase.</li></ul>
<h2>Perché li trattiamo e su quale base</h2><ul><li>Gestire account, gioco e classifiche: esecuzione del servizio che richiedi (art. 6.1.b GDPR).</li><li>Sicurezza e prevenzione abusi: legittimo interesse (art. 6.1.f).</li><li>Email di promemoria o novità: consenso, revocabile in ogni momento (art. 6.1.a).</li></ul>
<h2>Con chi li condividiamo</h2><p>Con i fornitori che fanno funzionare il sito: Supabase (database e accesso), Vercel (hosting), [servizio di invio email, es. Brevo o Resend]. Alcuni possono trattare dati fuori dallo Spazio Economico Europeo, con le garanzie previste dal GDPR (clausole contrattuali standard). Non vendiamo i tuoi dati.</p>
<h2>Per quanto tempo</h2><p>Finché il tuo account è attivo. Se lo elimini, cancelliamo email, nome e pronostici entro [30] giorni, salvo obblighi di legge.</p>
<h2>I tuoi diritti</h2><p>Puoi chiedere accesso, rettifica, cancellazione, limitazione, portabilità e opporti al trattamento scrivendo a [email]. Puoi anche proporre reclamo al Garante per la protezione dei dati personali (garanteprivacy.it).</p>

<h2>1. Cos'è il sito</h2><p>[Nome del sito] è un gioco di pronostici gratuito sui tornei a tabellone. Non è un servizio di scommesse: non si punta denaro e non è prevista alcuna vincita in denaro.</p>
<h2>2. Account</h2><p>Per giocare ti registri con la tua email. Devi avere almeno [18] anni. Sei responsabile dell'accesso alla tua email. Un solo account per persona.</p>
<h2>3. Come si gioca</h2><p>Per ogni fase di un evento puoi salvare fino a 3 pronostici. Le fasi si aprono e chiudono agli orari indicati nel sito e dopo la chiusura non si modifica nulla. I punti si calcolano con le regole descritte nelle pagine "Come funziona". Per ogni evento, in classifica conta il tuo miglior pronostico.</p>

<h2>5. Comportamenti vietati</h2><p>È vietato usare più account per aggirare il limite dei pronostici, alterare il funzionamento del sito, inserire nomi offensivi o che violino diritti altrui. Possiamo sospendere o eliminare gli account che violano queste regole.</p>
<h2>6. Responsabilità</h2><p>Il sito è offerto "così com'è". Facciamo il possibile per l'esattezza di tabelloni e risultati, ma non garantiamo assenza di errori o interruzioni. Non siamo affiliati agli organizzatori dei tornei; nomi e marchi appartengono ai rispettivi titolari.</p>
<h2>7. Modifiche</h2><p>Possiamo aggiornare queste condizioni; le modifiche valgono dalla pubblicazione. Se cambiano aspetti importanti, ti avvisiamo via email.</p>

<p><small>Ultimo aggiornamento: [data]</small></p>`}

function adminInit(){document.getElementById("acr").onclick=createEvent;const p=k=>String(k).padStart(2,"0"),t=d=>d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes()),n=new Date();document.getElementById("aap").value=t(n);document.getElementById("ach").value=t(new Date(n.getTime()+864e5))}

const rt=P=>{const cnt=P.rounds.map((_,r)=>P.M.filter(m=>m.r===r).length);return`<div class="scroll"><table><tr><th>Turno</th><th>Partite</th><th>Punti base</th><th>Underdog</th><th>Turno perfetto</th></tr>${P.rounds.map((q,r)=>`<tr><td>${q[0]}</td><td>${cnt[r]}</td><td>${q[1]}</td><td>${P.und?"+"+f(q[2]*100)+"%":"–"}</td><td>${q[3]?"+"+f(q[1]*cnt[r]*q[2]):"–"}</td></tr>`).join("")}</table></div>`};
const rt2=id=>{const e=E.find(x=>x.id===id),n=e.R.length;return`<div class="scroll"><table><tr><th>Turno</th><th>Partite</th><th>Punti base</th><th>Turno perfetto</th></tr>${e.R.map(([nm,m,b],r)=>`<tr><td>${nm}</td><td>${m}</td><td>${b}</td><td>${r<n-1?"+"+f(b*m*pct(r,n)):"–"}</td></tr>`).join("")}</table></div>`};
const FQ=(q,a)=>`<details class="box"><summary>${q}</summary><p>${a}</p></details>`;
const EX=t=>`<div class="ex">${t}</div>`;
const BASEP="<p>Per ogni partita scegli chi passa. I punti base raddoppiano a ogni turno, così ogni turno ha lo stesso massimo. Due bonus completano il quadro: il <b>blocco</b> (×1,5 se indovini due partite i cui vincitori si incontrano al turno dopo) e il <b>turno perfetto</b> (tutte le partite di un turno giuste, la finale esclusa).</p>";
const howTennis=()=>`<p>Pronostichi il tabellone di uno Slam: 128 giocatori e 7 turni. Per ogni partita scegli chi passa e, se vuoi, come finisce.</p>
<h2>Il tabellone e i seed</h2><p>I 32 giocatori con il seed (da 1 a 32) partono favoriti, tutti gli altri sono "non classificati". Tra due non classificati non c'è un favorito, quindi nessun bonus underdog.</p>
${BASEP}<h2>I punti, turno per turno</h2>${rt(D.ao.ph[0])}
<h2>Come finisce la partita</h2><div class="scroll"><table><tr><th>Cosa si pronostica</th><th>Moltiplicatore</th></tr><tr><td>Uomini (al meglio dei 5): 3, 4 o 5 set</td><td>×2</td></tr><tr><td>Donne (al meglio dei 3): 2 o 3 set</td><td>×2</td></tr><tr><td>Ritiro o walkover dell'avversario</td><td>×4</td></tr></table></div>
<p>Il bonus si applica ai punti della partita (base e underdog). Se l'avversario che avevi previsto non è quello vero, ma il tuo giocatore passa e indovini la durata, il bonus si dimezza. Il bonus durata è facoltativo.</p>
<p>Un dato dall'Australian Open 2026: le 120 partite giocate fino in fondo sono finite in 3 set 61 volte (51%), in 4 set 37 volte e in 5 set 22 volte. Sette partite su 127 (5,5%) si sono chiuse per ritiro o walkover.</p>
<h2>Esempi dall'Australian Open 2026</h2>
${EX("<b>La finale.</b> Alcaraz (seed 1) batte Djokovic (seed 4) in 4 set. Punti base della finale: 64, nessun underdog (vince il favorito). Se avevi previsto Alcaraz, Djokovic come avversario e 4 set, il bonus durata raddoppia: <b>128 punti</b> su una sola partita.")}
${EX("<b>Un ritiro.</b> Al primo turno Borges (non classificato) passa perché Auger-Aliassime (seed 7) si ritira. Base 1 più underdog (25%) fanno 1,25. Se avevi scelto Borges e <b>R</b>, il bonus ×4 porta a <b>5 punti</b>.")}
${EX("<b>Un blocco.</b> Al primo turno Alcaraz batte Walton e Hanfmann batte Svajda: i due vincitori si incontrano al secondo turno. 1 + 1 punti, più la metà per il blocco: <b>3 punti</b>.")}
<h2>Cosa sapere</h2>
<p>Al primo turno i giocatori sono spesso sconosciuti e gli errori sono normali: nel 2026 il tabellone costruito scegliendo sempre il seed migliore ha azzeccato il 59% delle partite (38 su 64). I punti pesano di più dagli ottavi in poi.</p>
${FQ("Cosa succede se un giocatore si ritira o non scende in campo?","Chi passa avanza comunque: se avevi scelto lui prendi i punti normali. Il bonus durata scatta solo se avevi indicato R e l'hai indovinato. Il walkover conta come ritiro.")}
${FQ("Cosa vuol dire non classificato?","Un giocatore senza seed: è nel tabellone ma non è tra i 32 favoriti.")}
${FQ("Se il mio giocatore è eliminato, perdo i punti dei turni dopo?","Sì: i punti si prendono solo se vince il giocatore che hai scelto. Le altre previsioni continuano a dare punti.")}
<h2>Glossario</h2><ul><li><b>Seed:</b> la posizione di partenza nel tabellone (1 è il migliore).</li><li><b>Set:</b> una partita si vince al meglio dei 5 (uomini) o dei 3 (donne).</li><li><b>Walkover:</b> partita non giocata perché un giocatore non scende in campo.</li><li><b>BYE:</b> un giocatore che entra direttamente al secondo turno.</li></ul>`;
const howCalcio=()=>`<p>Il calcio ha due strutture: la Champions League (e l'Europa League) in tre fasi, e i tornei per nazionali (Mondiali, Europei, Copa América) in due fasi.</p>
<h2>Champions League ed Europa League</h2>
<ol><li><b>Fase 1 · prima del torneo.</b> Assegni ognuna delle 36 squadre a un blocco della classifica finale: prime 8 (dirette agli ottavi), playoff (9°-24°) o eliminate (25°-36°). Per ogni squadra nel blocco giusto: 3 punti le prime 8, 1 i playoff, 2 le eliminate.</li><li><b>Fase 2 · a classifica finale.</b> I playoff reali: scegli chi passa.</li><li><b>Fase 3 · a playoff chiusi.</b> Tabellone da ottavi a finale.</li></ol>
<p>Il seed è la posizione nella classifica a 36 squadre: l'underdog è la squadra peggio classificata. I punti di ogni fase si sommano.</p>
${BASEP}<h3>Playoff</h3>${rt(D.ucl.ph[1])}<h3>Ottavi, quarti, semifinali e finale</h3>${rt(D.ucl.ph[2])}
<h2>Come finisce la sfida</h2><div class="scroll"><table><tr><th>Formato</th><th>Cosa si pronostica</th><th>Moltiplicatore</th></tr><tr><td>Doppia sfida (andata e ritorno)</td><td>180 minuti · supplementari · rigori</td><td>×1,25 · ×3 · ×4</td></tr><tr><td>Gara secca e finale</td><td>90 minuti · supplementari · rigori</td><td>×1,25 · ×3 · ×2</td></tr></table></div>
<p>In una doppia sfida "180" significa che si decide con il risultato complessivo dei due match. "S" vuol dire supplementari del ritorno senza rigori, "R" vuol dire rigori (dopo i supplementari). Se l'avversario che avevi previsto non è quello vero il bonus si dimezza.</p>
<h2>Mondiali, Europei e Copa América</h2>
<ol><li><b>Fase 1 · prima del torneo.</b> Per ogni squadra indichi se si qualifica al tabellone, sì o no. Mondiali: 48 squadre, 32 passano (sì 1 punto, no 2). Europei: 24 squadre, 16 passano (sì 1, no 2). Copa América: 16 squadre, 8 passano (sì 1, no 1). Se azzecchi tutte e quattro le squadre di un gruppo, i punti del gruppo valgono ×1,5.</li><li><b>Fase 2 · a gironi chiusi.</b> Il tabellone reale a eliminazione diretta. Non c'è un ranking, quindi nessun bonus underdog. Le partite sono gare secche: 90 minuti, supplementari o rigori.</li></ol>
<h3>Mondiali</h3>${rt2("wc")}<h3>Europei</h3>${rt2("euro")}<h3>Copa América</h3>${rt2("copa")}
<h2>Esempi dalla Champions League 2025-26</h2>
${EX("<b>Un playoff ai supplementari.</b> La Galatasaray (20ª) elimina la Juventus (13ª) dopo i supplementari del ritorno. Base 1 più underdog (25%) fanno 1,25. Se avevi scelto la Galatasaray e <b>S</b>, il bonus ×3 porta a <b>3,75 punti</b>.")}
${EX("<b>La finale.</b> Il PSG, 11° in classifica, batte l'Arsenal, 1°, ai rigori. Base 16 più underdog 16 fanno 32. Se avevi scelto <b>R</b>, in finale il bonus vale ×2: <b>64 punti</b>.")}
${EX("<b>La classifica.</b> Nella fase 1 assegni il Napoli alle eliminate: è finito davvero tra le ultime 12, quindi prendi <b>2 punti</b>.")}
${FQ("Che differenza c'è tra 180 e 90?","180 si usa nelle doppie sfide (due partite), 90 nelle gare secche e nella finale.")}
${FQ("Se si va ai rigori dopo i supplementari, cosa conta?","Conta R: i rigori sono sempre lo scenario più alto.")}
<h2>Glossario</h2><ul><li><b>Doppia sfida:</b> andata e ritorno, passa chi ha il risultato complessivo migliore.</li><li><b>Gara secca:</b> una sola partita.</li><li><b>S · R:</b> supplementari · rigori.</li><li><b>Playoff:</b> il turno tra le squadre dal 9° al 24° posto della classifica a 36.</li></ul>`;
const howBasket=()=>`<p>Nel basket pronostichi chi passa le serie dei playoff e in quante partite. Per Mondiali ed Europei di basket vale la struttura delle nazionali, con un tabellone di partite secche.</p>
<h2>Playoff NBA</h2><p>16 squadre, 8 per conference (Ovest a sinistra, Est a destra), con le due finaliste di conference che si incontrano nella finale NBA. Le serie sono al meglio delle 7. I pronostici si aprono dopo il play-in, quando il tabellone dei 16 è definito.</p>
${BASEP}${rt(D.nba.ph[0])}
<p>L'underdog è la squadra con il seed peggiore nella propria conference. In finale NBA, dove le due squadre vengono da conference diverse, l'underdog è chi ha il peggior record di regular season.</p>
<h2>Come finisce la serie</h2><p>Pronostichi in quante partite si chiude la serie (da 4 a 7). Se indovini vincitore e lunghezza, i punti della serie raddoppiano (×2). Se la serie reale è tra squadre diverse da quelle previste, ma il tuo vincitore passa, il bonus si dimezza.</p>
<h2>Esempi dai playoff NBA 2026</h2>
${EX("<b>La finale.</b> I Knicks (53-29) battono gli Spurs (62-20) per 4-1 e sono gli underdog per record. Punti base 8, più 8 di underdog fanno 16. Se avevi previsto anche \"in 5 partite\": <b>32 punti</b>.")}
${EX("<b>Un blocco.</b> Al primo turno a Est i Pistons battono i Magic e i Cavaliers battono i Raptors. Le due serie portano alla stessa semifinale: 1 + 1 punti più la metà, <b>3 punti</b>.")}
${EX("<b>Una sorpresa.</b> I 76ers (7° a Est) battono i Celtics (2°) al primo turno: base 1 più underdog 25%, <b>1,25 punti</b>.")}
<h2>Playoff di Serie A (LBA) e Mondiali ed Europei di basket</h2>
<p>I playoff di Serie A funzioneranno come l'NBA, con un solo tabellone (formato delle serie da confermare con i dati dell'ultima stagione). Mondiali ed Europei avranno due fasi: prima chi si qualifica al tabellone (sì/no), poi il tabellone con partite secche in cui si pronostica se la partita finisce ai tempi regolamentari o ai supplementari. I valori sono in definizione.</p>
${FQ("Cosa succede se la mia squadra viene eliminata?","Prendi i punti di una serie solo se vince la squadra che hai scelto. Le altre serie continuano a darti punti.")}
<h2>Glossario</h2><ul><li><b>Play-in:</b> gli spareggi per assegnare gli ultimi posti nei playoff (7°-10° di ogni conference).</li><li><b>Seed:</b> la posizione nella conference dopo la stagione regolare.</li><li><b>Serie:</b> più partite tra le stesse due squadre, passa chi ne vince 4.</li></ul>`;
const howPallavolo=()=>`<p>Gli eventi di pallavolo non sono ancora online. Ecco come funzioneranno, seguendo le strutture già usate negli altri sport.</p>
<h2>Playoff SuperLega e Serie A1 femminile</h2><p>Un tabellone a serie, come i playoff NBA: scegli chi passa ogni serie e in quante partite (la durata vale ×2). Il formato delle serie va confermato con i dati dell'ultima stagione.</p>
${BASEP}
<h2>Mondiali ed Europei</h2><p>Due fasi: prima indichi quali squadre si qualificano al tabellone (sì/no), poi il tabellone reale a eliminazione diretta. Le partite sono al meglio dei 5 set: pronostichi se finisce 3-0, 3-1 o 3-2 (con la stessa logica del tennis, ×2), senza bonus underdog perché non c'è un ranking di torneo.</p>
${FQ("Quando si apre?","Appena iniziano gli eventi: lo spiegheremo qui, con un'edizione storica per provare.")}
<h2>Glossario</h2><ul><li><b>Set:</b> la partita si vince al meglio dei 5 set.</li><li><b>Serie:</b> più partite tra le stesse due squadre, passa chi ne vince un numero prefissato.</li></ul>`;
const comeSport=k=>`<div class="how">${({tennis:howTennis,calcio:howCalcio,basket:howBasket,pallavolo:howPallavolo}[k])()}</div>`;

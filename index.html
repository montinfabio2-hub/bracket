*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.45}
a{color:inherit}main{max-width:1000px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:22px}
.logo{font-weight:800;font-size:1.5rem;letter-spacing:-.03em;text-decoration:none}.logo span{background:var(--acc);color:var(--accink);padding:0 7px;border-radius:6px}
nav{display:flex;gap:6px;flex-wrap:wrap}nav a{padding:6px 12px;border:1.5px solid var(--ink);border-radius:999px;text-decoration:none;font-size:.9rem}nav a.on{background:var(--acc);color:var(--accink);font-weight:600}

p,li{color:var(--mute);max-width:70ch}.crumb{font-size:.85rem;color:var(--mute);margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;text-decoration:none}.card:hover{border-color:var(--ink)}
.card b{font-size:1.1rem;display:block;margin-bottom:4px}.card small{color:var(--mute)}.em{font-size:2rem}
.chip{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);margin-bottom:6px;font-weight:600}.chip.live{color:var(--ok);border-color:var(--ok)}.chip.prep{color:var(--warn);border-color:var(--warn)}
.btn{display:inline-block;background:var(--acc);color:var(--accink);font-weight:600;padding:9px 16px;border-radius:999px;text-decoration:none;margin:6px 0}
table{border-collapse:collapse;width:100%;max-width:700px;background:var(--card);border:1px solid var(--line);border-radius:8px}td,th{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);font-weight:400;font-size:.9rem}th{font-weight:600}
ol,ul{padding-left:20px}.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:10px}
.scroll{overflow-x:auto}

.g1{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:8px}
.r1{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;justify-content:space-between;font-size:.88rem}
.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.g3{display:flex;gap:10px}.col{flex:1;min-width:180px;display:flex;flex-direction:column;justify-content:space-around;gap:6px}
.col h2{font-size:.78rem;margin:0;font-weight:600;color:var(--mute);position:sticky;top:0;background:var(--bg);padding:3px 0}
.m{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:.82rem}.m.blk{outline:3px solid var(--ok)}
.t{display:flex;gap:6px;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-bottom:1px solid var(--line);font:inherit;color:inherit;cursor:pointer}
.t:disabled{cursor:default;color:var(--mute)}.t b{min-width:1.5em;color:var(--mute)}.t.sel{background:var(--acc);color:var(--accink)}.t.sel b{color:var(--accink)}
.t.win{box-shadow:inset 0 0 0 2px var(--ok)}.t.lose{box-shadow:inset 0 0 0 2px var(--ko,#c0392b);text-decoration:line-through}
.L{display:flex;align-items:center;gap:4px;padding:5px 8px}.r1 .L{padding:0}
.L button,.bar button{font:inherit;color:inherit;cursor:pointer}.L button{border:1px solid var(--line);background:none;border-radius:6px;min-width:28px;height:24px;padding:0 6px}
.L button.sel{background:var(--ink);color:var(--card);border-color:var(--ink)}.L button:disabled{opacity:.4;cursor:default}
.res{padding:5px 8px;font-size:.74rem;color:var(--mute);width:100%}.m .res{border-top:1px solid var(--line);background:var(--bg)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.bar button{border:1.5px solid var(--ink);background:transparent;padding:7px 13px;border-radius:999px}
.bar button[aria-pressed=true],.bar .go{background:var(--acc);color:var(--accink);font-weight:600}
.score{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}.big{font-size:2.2rem;font-weight:800}
tr.me td{font-weight:600}#auth{font-size:.85rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap}#auth input,.bar select{font:inherit;padding:6px 10px;border:1.5px solid var(--ink);border-radius:999px;background:var(--card);color:var(--ink)}#auth button{font:inherit;padding:6px 12px;border:1.5px solid var(--ink);border-radius:999px;background:transparent;color:inherit;cursor:pointer}

function drawAuth(){const el=document.getElementById("auth");if(!el)return;if(!sb){el.innerHTML="<small>Modalità prova: nessun salvataggio</small>";return}
el.innerHTML=ME?`<small>${NICK||ME.email}</small>${NICK?"":'<input id="nk" placeholder="Il tuo nome (2-24 caratteri)"><button id="nkb">Salva nome</button>'}<button id="out">Esci</button>`:'<input id="em" type="email" placeholder="la tua email"><button id="inb">Ricevi il link di accesso</button>';
if(ME){document.getElementById("out").onclick=()=>sb.auth.signOut();const b=document.getElementById("nkb");if(b)b.onclick=async()=>{const v=document.getElementById("nk").value.trim();if(v.length<2||v.length>24)return alert("Il nome deve avere da 2 a 24 caratteri.");const r=await sb.from("profiles").upsert({user_id:ME.id,display_name:v});if(r.error)return alert(r.error.message);NICK=v;drawAuth()}}
else document.getElementById("inb").onclick=async()=>{const e=document.getElementById("em").value.trim();if(!e)return;const r=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.href.split("#")[0]}});alert(r.error?r.error.message:"Controlla la tua email: ti abbiamo mandato il link di accesso.")}}
function applySlot(){const ev=EV();ev.ph.forEach((P,i)=>{const sv=(G.saved||{})[i+"_"+G.slot];G.st[i]={pk:sv?hfix(sv.pk):[],pd:sv?hfix(sv.pd):[],cl:sv?hfix(sv.cl):[],sh:isClosed(G.id,i)?1:0}})}
async function loadLive(id){const ev=D[id];const[w,r]=await Promise.all([sb.from("phase_windows").select("*").eq("event_id",id),sb.from("results").select("*").eq("event_id",id)]);
WIN[id]={};(w.data||[]).forEach(x=>WIN[id][x.phase_idx]=x);
(r.data||[]).forEach(x=>{const P=ev.ph[x.phase_idx];if(!P)return;if(P.t==="c")P.real=hfix(x.data.real);else P.M.forEach((m,i)=>{const a=hfix(x.data.w)[i],b=hfix(x.data.d)[i];m.w=a;m.d=b})});
G.saved={};if(ME){const e=await sb.from("entries").select("*").eq("event_id",id).eq("user_id",ME.id);(e.data||[]).forEach(x=>{G.saved[x.phase_idx+"_"+x.slot]=x.picks})}
if(G.id!==id)return;applySlot();if(ev.ph.some((_,i)=>isClosed(id,i)))await loadBoard(id);play()}
async function loadBoard(id){const ev=D[id],e=await sb.from("entries").select("user_id,slot,phase_idx,picks").eq("event_id",id),rows=e.data||[],by={};
rows.forEach(x=>{const k=x.user_id+"_"+x.slot,o=by[k]=by[k]||{u:x.user_id,s:x.slot,t:0},P=ev.ph[x.phase_idx];if(!P||!isClosed(id,x.phase_idx))return;o.t+=stTot(P,{pk:hfix(x.picks.pk),pd:hfix(x.picks.pd),cl:hfix(x.picks.cl)})});
const ids=[...new Set(rows.map(x=>x.user_id))],pr=ids.length?await sb.from("profiles").select("user_id,display_name").in("user_id",ids):{data:[]},nm={};(pr.data||[]).forEach(x=>nm[x.user_id]=x.display_name);
G.board=Object.values(by).map(x=>[(nm[x.u]||"Anonimo")+(x.s>1?" #"+x.s:""),x.t]).sort((a,b)=>b[1]-a[1]).slice(0,50)}
function liveBar(){const id=G.id,w=(WIN[id]||{})[G.pi],n=new Date(),f=d=>new Date(d).toLocaleString("it-IT"),st=!w?"Finestra non ancora impostata":n<new Date(w.opens_at)?"Apre il "+f(w.opens_at):n<=new Date(w.closes_at)?"Aperta fino al "+f(w.closes_at):"Chiusa";
return`<span style="padding:7px 4px;color:var(--mute)">${st}</span><select onchange="G.slot=+this.value;applySlot();play()">${[1,2,3].map(k=>`<option value="${k}" ${G.slot===k?"selected":""}>Pronostico ${k}</option>`).join("")}</select><button class="go" onclick="saveEntry()">Salva pronostico</button>`}
async function saveEntry(){const id=G.id,pi=G.pi,s=SS(),w=(WIN[id]||{})[pi],n=new Date();if(!ME)return alert("Accedi prima con la tua email.");if(!NICK)return alert("Scegli prima il tuo nome.");
if(!w||n<new Date(w.opens_at)||n>new Date(w.closes_at))return alert("Questa fase non è aperta.");
const r=await sb.from("entries").upsert({user_id:ME.id,event_id:id,phase_idx:pi,slot:G.slot,picks:{pk:s.pk,pd:s.pd,cl:s.cl}},{onConflict:"user_id,event_id,phase_idx,slot"});alert(r.error?r.error.message:"Pronostico salvato.")}
let _t=null;function dbRes(){if(!sb||!EV().live)return;clearTimeout(_t);const id=G.id,pi=G.pi;_t=setTimeout(async()=>{const P=D[id].ph[pi],data=P.t==="c"?{real:P.real.map(v=>v===undefined?null:v)}:{w:P.M.map(m=>m.w===undefined?null:m.w),d:P.M.map(m=>m.d===undefined?null:m.d)};const r=await sb.from("results").upsert({event_id:id,phase_idx:pi,data,updated_at:new Date().toISOString()},{onConflict:"event_id,phase_idx"});if(r.error)alert(r.error.message)},500)}
function collect(P,root){const o=P.rounds.map(()=>[]);(function d(i){const m=P.M[i];if(m.f){d(m.f[0]);d(m.f[1])}o[m.r].push(i)})(root);return o}
function cols(P){const n=P.rounds.length,N=P.M.length;
if(P.mirror){const root=N-1,[l,r]=P.flip?[P.M[root].f[1],P.M[root].f[0]]:P.M[root].f,L=collect(P,l),Rr=collect(P,r),c=[];
for(let k=0;k<n-1;k++)c.push([P.sides[0]+" · "+P.rounds[k][0],L[k]]);c.push([P.rounds[n-1][0],[root]]);for(let k=n-2;k>=0;k--)c.push([P.sides[1]+" · "+P.rounds[k][0],Rr[k]]);return c}
const ref=new Set();P.M.forEach(m=>m.f&&m.f.forEach(k=>ref.add(k)));const ord=P.rounds.map(()=>[]);
P.M.forEach((m,i)=>{if(!ref.has(i)){const o=collect(P,i);o.forEach((a,k)=>ord[k].push(...a))}});return ord.map((a,k)=>[P.rounds[k][0],a])}
function play(){const ev=EV(),P=PH(),s=SS(),T=ev.T,A=!!G.admin,LV=!!(ev.live&&sb),Lb=t=>(ev.S[t]?ev.S[t]:"–");
document.getElementById("tabs").innerHTML=ev.ph.map((p,k)=>`<button aria-pressed="${G.pi===k}" onclick="G.pi=${k};play()">${p.nm}</button>`).join("")+`<button id="fv">${P.t==="c"?"Compila a caso":"Compila i favoriti"}</button>${P.t==="b"?'<button id="rn">Compila a caso</button>':""}<button id="rs">Azzera fase</button>${LV?"":'<button class="go" id="sw">Svela i risultati della fase</button>'}${ADMIN?`<button aria-pressed="${A}" onclick="G.admin=!G.admin;play()">Admin: carica i risultati</button>`:""}${LV?liveBar():""}`;
document.getElementById("fv").onclick=()=>{fillSt(P,s,0);play()};if(P.t==="b")document.getElementById("rn").onclick=()=>{fillSt(P,s,1);play()};
document.getElementById("rs").onclick=()=>{G.st[G.pi]={pk:[],pd:[],cl:[],sh:s.sh};play()};if(!LV)document.getElementById("sw").onclick=()=>{s.sh=1;play()};
let h="",tbl="",sub=0,C=null;
if(P.t==="c"){const o=T.map((_,i)=>i).sort((a,b)=>T[a].localeCompare(T[b])),c=P.cats.map((_,k)=>s.cl.filter(x=>x===k).length);
h=`<p>${P.intro} Assegnate: ${P.cats.map((n,k)=>`${n} ${c[k]}/${P.real.filter(x=>x===k).length}`).join(" · ")}.</p><div class="g1">${o.map(i=>`<div class="r1"><span>${T[i]}</span><div class="L">${P.cats.map((n,k)=>`<button class="${(A?P.real[i]:s.cl[i])===k?"sel":""}" onclick="${A?"ac":"sc"}(${i},${k})">${n}</button>`).join("")}</div>${s.sh&&!A?`<div class="res">${P.real[i]===undefined?"risultato non ancora noto":(s.cl[i]===P.real[i]?"✓":"✗")+" reale: "+(i+1)+"° · "+P.cats[P.real[i]]}</div>`:""}</div>`).join("")}</div>`;
if(s.sh){const X=scoreC(P,s.cl);sub=X.tot;tbl=`<table><tr><th>Blocco</th><th>Giuste</th><th>Punti</th></tr>${X.R.map((x,k)=>`<tr><td>${P.cats[k]}</td><td>${x.n}/${P.real.filter(y=>y===k).length}</td><td>${x.p}</td></tr>`).join("")}</table>`}}
else{C=s.sh?scoreB(P,s.pk,s.pd):null;const du=m=>DUR[m.du||P.du].L;
const card=i=>{const m=P.M[i],ps=A?rpt(P,i):prt(P,s.pk,i),def=ps[0]!==undefined&&ps[1]!==undefined;
return`<div class="m${C&&C.blk[i]?" blk":""}">${ps.map(t=>{const on=t!==undefined,sel=on&&(A?m.w:s.pk[i])===t;return`<button class="t${sel?" sel":""}${C&&sel&&!A&&m.w!==undefined?(C.ok[i]?" win":" lose"):""}" ${on?"":"disabled"} onclick="${A?"af":"pkf"}(${i},${t})"><b>${on?Lb(t):"–"}</b>${on?T[t]:"da definire"}</button>`}).join("")}<div class="L">${du(m).map((l,k)=>`<button class="${(A?m.d:s.pd[i])===k?"sel":""}" ${def?"":"disabled"} onclick="${A?"ad":"pdf"}(${i},${k})">${l}</button>`).join("")}</div>${C&&!A?`<div class="res">${m.w===undefined?"da giocare":T[m.w]+" · "+(du(m)[m.d]||"–")+" · +"+ +C.pt[i].toFixed(2)}</div>`:""}</div>`};
h=`<p>${P.intro}</p><div class="scroll"><div class="g3" style="min-width:${cols(P).length*190}px">${cols(P).map(([n,ms])=>`<div class="col"><h2>${n}</h2>${ms.map(card).join("")}</div>`).join("")}</div></div>`;
if(C){sub=C.tot;tbl=`<div class="scroll"><table><tr><th>Turno</th><th>Base</th><th>Underdog</th><th>Blocchi</th><th>Perfetto</th><th>Durata</th><th>Totale</th></tr>${C.R.map((x,r)=>`<tr><td>${P.rounds[r][0]}</td>${[x.b,x.u,x.k,x.p,x.e,x.t].map(v=>`<td>${+v.toFixed(2)}</td>`).join("")}</tr>`).join("")}</table></div>`}}
document.getElementById("panel").innerHTML=h;const S=document.getElementById("score");
if(!s.sh){S.innerHTML=LV?"<p style='margin:0'>Fase in corso: compila e salva il tuo pronostico. Risultati e classifica compaiono alla chiusura della fase.</p>":"<p style='margin:0'>Compila la fase (o usa i pulsanti rapidi) e premi “Svela i risultati della fase”.</p>";return}
const tot=g=>ev.ph.reduce((a,p,i)=>a+(G.st[i].sh?stTot(p,g[i]):0),0),me=tot(G.st),
rows=(LV?(G.board||[]):[["Tu",me],["Bot · sempre i favoriti",tot(G.bots[0])],["Bot · a caso",tot(G.bots[1])]]).sort((a,b)=>b[1]-a[1]);
S.innerHTML=`<div class="big">${+sub.toFixed(2)} punti in questa fase</div><p>Massimo della fase: ${+maxP(P).toFixed(2)} · Totale nelle fasi svelate: ${+me.toFixed(2)}</p>${tbl}<h2>${LV?"Classifica":"Classifica di prova"}</h2><table>${rows.map(([n,v],i)=>`<tr class="${n==="Tu"?"me":""}"><td>${rows.findIndex(r=>r[1]===v)+1}°</td><td>${n}</td><td>${+v.toFixed(2)}</td></tr>`).join("")}</table>`}
